function renderSummary(){$("total").textContent=yen(total());$("count").textContent=activeOrders().length+"品";$("pending").textContent=pendingOrders().length+"品";var p=pendingOrders().length;$("badge").style.display=p?"inline-block":"none";$("badge").textContent=p}
function renderTimer(){var e=elapsed(),limit=(st.minutes+st.extCount*30)*60,rem=limit-e,r=$("remaining");$("elapsed").textContent=mmss(e);r.className="timerValue";if(!st.sessionStart)r.textContent=mmss(limit);else if(rem>=0){r.textContent=mmss(rem);if(rem<=300)r.classList.add("danger");else if(rem<=900)r.classList.add("warn")}else{r.textContent="+"+mmss(-rem);r.classList.add("danger")}if(st.sessionStart){var d=new Date(st.sessionStart),x=st.extCount?" ・ 延長"+st.extCount+"回（合計"+(st.minutes+st.extCount*30)+"分）":"";$("startSub").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+" 開始"+x;$("start").textContent="進行中";$("start").disabled=true;$("extend").disabled=false}else{$("startSub").textContent="開始したらタイマーをスタート";$("start").textContent="スタート";$("start").disabled=false;$("extend").disabled=true}$("extend").textContent="＋30分延長（大人"+yen(st.adultExt)+" / 子供"+yen(st.childExt)+"）"}
function renderHistory(){var now=Date.now(),a=st.orders.slice().sort(function(x,y){return x.createdAt-y.createdAt});if(filter==="pending")a=a.filter(function(o){return !o.cancelled&&!o.servedAt});if(filter==="served")a=a.filter(function(o){return !o.cancelled&&o.servedAt});$("history").innerHTML=a.map(function(o){var served=!!o.servedAt,w=Math.max(0,Math.floor(((served?o.servedAt:now)-o.createdAt)/1000));return '<div class="item '+(served?'served ':'')+(o.cancelled?'cancelled':'')+'"><div class="top"><div class="time">'+mmss(o.elapsedSec||0)+'</div><div class="name">'+o.name+'</div><div class="price">'+(o.price?yen(o.price):"0円")+'</div></div><div class="bottom">'+(o.cancelled?'<span class="wait">取消済み</span>':'<button class="status '+(served?'servedBtn':'pending')+'" data-status="'+o.id+'">'+(served?'✓ 到着済み':'● 未到着')+'</button><div class="wait">'+(served?'注文から '+mmss(w)+' で到着':'注文から '+mmss(w))+'</div><button class="cancel" data-cancel="'+o.id+'">取消</button>')+'</div></div>'}).join("")||'<div class="empty">まだ注文履歴はありません</div>';document.querySelectorAll("[data-status]").forEach(function(b){b.onclick=function(){var o=st.orders.find(function(x){return x.id===b.dataset.status});o.servedAt=o.servedAt?null:Date.now();save();renderSummary();renderHistory()}});document.querySelectorAll("[data-cancel]").forEach(function(b){b.onclick=function(){var o=st.orders.find(function(x){return x.id===b.dataset.cancel});o.cancelled=true;save();renderSummary();renderHistory();toast("注文を取消しました")}})}
function sync(){for(var i=0;i<=10;i++){if(!$("adult").options[i]){$("adult").add(new Option(i+"人",i));$("child").add(new Option(i+"人",i))}}$("adult").value=st.adultCount;$("child").value=st.childCount;$("adultBase").value=st.adultBase;$("otoshi").value=st.otoshi;$("childBase").value=st.childBase;$("adultExt").value=st.adultExt;$("childExt").value=st.childExt;$("minutes").value=st.minutes;$("includeBase").checked=st.includeBase;if(st.sessionStart){var d=new Date(st.sessionStart);$("startTime").value=pad(d.getHours())+":"+pad(d.getMinutes())}}
function readSettings(){st.adultCount=Number($("adult").value)||0;st.childCount=Number($("child").value)||0;st.adultBase=Number($("adultBase").value)||0;st.otoshi=Number($("otoshi").value)||0;st.childBase=Number($("childBase").value)||0;st.adultExt=Number($("adultExt").value)||0;st.childExt=Number($("childExt").value)||0;st.minutes=Math.max(1,Number($("minutes").value)||60);st.includeBase=$("includeBase").checked;save();renderSummary();renderTimer()}
function open(id){$(id).classList.add("open")}function close(id){$(id).classList.remove("open")}
function switchView(v){view=v;$("orderView").style.display=v==="order"?"block":"none";$("historyView").style.display=v==="history"?"block":"none";$("navOrder").classList.toggle("active",v==="order");$("navHistory").classList.toggle("active",v==="history");if(v==="history")renderHistory()}
$("start").onclick=function(){if(!st.sessionStart){st.sessionStart=Date.now();save();renderTimer();renderSummary();toast("60分タイマーを開始しました")}};
$("extend").onclick=function(){if(!st.sessionStart)return;var a=st.adultCount*st.adultExt,c=st.childCount*st.childExt,t=a+c;if(confirm("30分延長しますか？\n大人 "+st.adultCount+"人 × "+yen(st.adultExt)+" = "+yen(a)+"\n子供 "+st.childCount+"人 × "+yen(st.childExt)+" = "+yen(c)+"\n合計 "+yen(t)+" を追加します。")){st.extCount++;save();renderTimer();renderSummary();toast("30分延長しました（＋"+yen(t)+"）")}};
$("search").oninput=renderMenu;$("gear").onclick=function(){sync();open("settings")};document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=function(){close(b.dataset.close)}});["adult","child","adultBase","otoshi","childBase","adultExt","childExt","minutes","includeBase"].forEach(function(id){$(id).onchange=readSettings});
$("applyTime").onclick=function(){var v=$("startTime").value;if(!v){toast("時刻を選んでください");return}var p=v.split(":"),d=new Date();d.setHours(Number(p[0]),Number(p[1]),0,0);if(d.getTime()>Date.now()+60000)d.setDate(d.getDate()-1);st.sessionStart=d.getTime();st.orders.forEach(function(o){o.elapsedSec=Math.max(0,Math.floor((o.createdAt-st.sessionStart)/1000))});save();renderTimer();renderHistory();close("settings");toast("開始時刻を変更しました")};
$("reset").onclick=function(){if(confirm("タイマー・注文履歴・到着状況をすべてリセットしますか？")){st=Object.assign({},def,{adultCount:st.adultCount,childCount:st.childCount,adultBase:st.adultBase,otoshi:st.otoshi,childBase:st.childBase,adultExt:st.adultExt,childExt:st.childExt,minutes:st.minutes,includeBase:st.includeBase,orders:[]});save();renderAll();close("settings");toast("今回の注文をリセットしました")}};
$("navOrder").onclick=function(){switchView("order")};$("navHistory").onclick=function(){switchView("history")};document.querySelectorAll("[data-filter]").forEach(function(b){b.onclick=function(){filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(function(x){x.classList.toggle("active",x===b)});renderHistory()}});
function renderAll(){sync();renderTabs();renderMenu();renderSummary();renderTimer();renderHistory()}setInterval(function(){renderTimer();if(view==="history")renderHistory()},1000);renderAll();if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
})();
</script>
</body>
</html>
